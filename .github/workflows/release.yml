name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version, notes and tag
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::gradle.properties must contain one stable X.Y.Z version'
            exit 1
          fi
          tag="v$version"
          notes=".github/release-notes/$version.md"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo '::error::Release tag does not match gradle.properties'
            exit 1
          fi
          if [[ ! -s "$notes" ]] || ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::Missing or empty $notes"
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          tagged_commit="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$commit" ]]; then
            echo '::error::Existing release tag points at another commit'
            exit 1
          fi
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          if grep -Fxq "$tag" <<< "$releases"; then
            echo "::error::Release $tag already exists; it will not be overwritten"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "notes=$notes"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test, sign and verify release artifacts
        env:
          DUM_SIGNING_KEY: ${{ secrets.DUM_SIGNING_KEY }}
        run: ./gradlew --no-daemon prepareRelease

      - name: Publish signed release with its checked-in description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          (cd build/release && sha256sum --check SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" \
            build/release/DUM-SDK.jar \
            build/release/DUM-SDK.jar.sig \
            "build/release/DUM-SDK-Paper-$RELEASE_VERSION.jar" \
            build/release/SHA256SUMS.txt \
            --draft --target "$RELEASE_COMMIT" \
            --title "DUM-SDK $RELEASE_VERSION" --notes-file "$RELEASE_NOTES"
          gh release edit "$RELEASE_TAG" --draft=false --latest

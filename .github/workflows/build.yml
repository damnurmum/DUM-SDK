name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: DUM-SDK
          path: |
            dum-fabric/build/libs/DUM-SDK-*.jar
            dum-paper/build/libs/DUM-SDK-Paper-*.jar

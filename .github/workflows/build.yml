name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: No typographic dashes or ellipses
        run: |
          if LC_ALL=C.UTF-8 grep -rnP '[\x{2014}\x{2013}\x{2026}]' --exclude-dir=.git .; then
            echo "Use a plain hyphen and three dots instead"
            exit 1
          fi

      # DUM-Core is private, so dum-paper is skipped here (no dumCorePath); everything else builds and is tested
      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: DUM-SDK
          path: dum-fabric/build/libs/DUM-SDK-*.jar

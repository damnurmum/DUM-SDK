# DUM-SDK server side. Every feature is a module with its own section; player texts are in messages.yml.

# Handshake with the DUM-SDK client mod in the configuration phase, before the player enters the world:
# version check, then the client installs the signed modules from plugins/DUM-SDK/modules.
# Players without the mod, with an incompatible version or failed modules are disconnected with an explanation.
handshake:
  enabled: true
  hello-timeout-seconds: 10     # how long to wait for the client's HELLO
  install-timeout-seconds: 120  # how long the client may take to download and check modules

# Messages from client modules to their server sides: a changed client could send any number of them.
# Per player and module: per-second on average, up to burst at once; the rest is dropped, and a player whose
# messages keep being dropped this many times in a row is disconnected.
module-messages:
  per-second: 20
  burst: 40
  disconnect-after: 100

# Client modules only operators get (module ids). Everyone else never receives the module, cannot download it,
# and its server side neither hears from nor sends to them.
ops-only: []
